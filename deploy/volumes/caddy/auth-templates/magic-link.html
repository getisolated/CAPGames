<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#060405;font-family:Helvetica,Arial,sans-serif;color:#f5efe6;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#060405;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:440px;background:#120c0e;border:1px solid #2a1c20;border-radius:16px;padding:32px;">
            <tr>
              <td align="center" style="font-size:12px;letter-spacing:3px;color:#c9a24a;text-transform:uppercase;">CAP Games</td>
            </tr>
            <tr>
              <td align="center" style="padding-top:12px;font-size:20px;font-weight:700;">Ton code de connexion</td>
            </tr>
            <tr>
              <td align="center" style="padding:28px 0 8px;">
                <div style="display:inline-block;padding:16px 28px;border-radius:12px;background:#1c1216;border:1px solid #c9a24a;font-size:36px;letter-spacing:10px;font-weight:700;color:#f5efe6;font-family:'Courier New',monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:8px;font-size:14px;line-height:22px;color:#b8aa9c;">
                Saisis ce code dans l'app pour rejoindre la soirée.<br />
                Il est valable une heure. Si tu n'as rien demandé, ignore cet e-mail.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-top:24px;font-size:12px;color:#6f635c;">Envoyé à {{ .Email }}</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
