  <link rel="preconnect" href="https://fonts.googleapis.com"/>

<body>
  <template id="__bundler_thumbnail" data-bg-color="#060405">
    <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="bg" cx="50%" cy="38%" r="62%">
          <stop offset="0%" stop-color="#3a1410"/>
          <stop offset="100%" stop-color="#060405"/>
        </radialGradient>
        <radialGradient id="orb" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#f3c98a"/>
          <stop offset="60%" stop-color="#d28a3a"/>
          <stop offset="100%" stop-color="#6a3e15"/>
        </radialGradient>
      </defs>
      <rect width="1200" height="800" fill="url(#bg)"/>
      <circle cx="600" cy="370" r="150" fill="url(#orb)" opacity="0.92"/>
      <circle cx="600" cy="370" r="190" fill="none" stroke="#d28a3a" stroke-width="2" opacity="0.4"/>
      <circle cx="600" cy="370" r="230" fill="none" stroke="#d28a3a" stroke-width="1.5" opacity="0.2"/>
      <text x="600" y="630" text-anchor="middle" fill="#f6efe2"
            font-family="Helvetica, Arial, sans-serif" font-weight="800"
            font-size="62" letter-spacing="4">CAP<tspan fill="#f3c98a" font-style="italic" font-weight="400" font-family="Georgia, serif"> GAMES</tspan></text>
    </svg>
  </template>
  <div id="root" style="color: rgba(0, 0, 0, 0)"></div>

  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <script type="text/babel" src="src/app.jsx"></script>
